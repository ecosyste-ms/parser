version: '3'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - PIDFILE=/usr/src/app/tmp/pids/server.pid
      - RAILS_ENV=development
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=development
      - DATABASE_HOST=database.service.parser.internal
      - POSTGRES_HOST=database.service.parser.internal
      - REDIS_URL=redis://redis.service.parser.internal:6379
    networks:
      - internal
    depends_on:
      - database.service.parser.internal
      - redis.service.parser.internal

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: bundle exec sidekiq -C config/sidekiq.yml
    environment:
      - RAILS_ENV=development
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=development
      - POSTGRES_HOST=database.service.parser.internal
      - REDIS_URL=redis://redis.service.parser.internal:6379
    networks:
      - internal
    depends_on:
      - app
      - redis.service.parser.internal

  database.service.parser.internal:
    image: postgres:14.1-alpine
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal
    environment:
      - POSTGRES_PASSWORD=development

  redis.service.parser.internal:
    image: redis:7-alpine
    networks:
      - internal

volumes:
  pg_data:

networks:
  internal:
    driver: bridge
